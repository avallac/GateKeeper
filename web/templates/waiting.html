<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User authorization</title>
    <meta http-equiv="refresh" content="3">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.2;
        }

        .subtitle {
            margin-top: 6px;
            color: #64748b;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            padding: 14px 16px;
            font-size: 15px;
            background: #ffffff;
            color: #0f172a;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: #0f172a;
        }

        .footer-text {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <div><img width="64px" src="static/logo.png"></div>
            <div>
                <h1>User authorization</h1>
            </div>
        </div>
        <div class="form-group" align="center">
            <img width="30%" src="static/loading.gif">
        </div>
        <div class="footer-text">
            Beavers are somewhere nearby
        </div>
    </div>
</div>
</body>
</html>
