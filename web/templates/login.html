<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User authorization</title>
    <link rel="stylesheet" href="static/styles.css" />
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <div><img width="64px" src="static/logo.png"></div>
            <div>
                <h1>User authorization</h1>
                <div class="subtitle">
                    Enter your name and phone number.
                </div>
            </div>
        </div>
        {{if .Error}}
            <div class="error-box">
                {{.Error}}
            </div>
        {{end}}
        <form action="ask_code" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="John Smith"
                        value="{{.Name}}"
                />
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="+44 7123 456789"
                        value="{{.Phone}}"
                />
            </div>

            <button type="submit" class="submit-button">
                Get Code
            </button>
        </form>

        <div class="footer-text">
            Beavers are somewhere nearby
        </div>
    </div>
</div>
</body>
</html>
